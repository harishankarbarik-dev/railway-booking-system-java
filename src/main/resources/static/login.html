<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRCTC Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
.topbar{background:#0b3d91;color:#fff;display:flex;justify-content:space-between;padding:8px 40px;font-size:13px}
.header{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 40px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.logo{font-size:28px;font-weight:900;color:#213d77}.logo span{color:#fb792b}.logo small{font-size:11px;color:#666;font-weight:400;letter-spacing:1px;display:block}
.btn{border:none;padding:11px 22px;border-radius:4px;cursor:pointer;font-weight:bold;font-size:14px;text-decoration:none;display:inline-block}
.btn-blue{background:#213d77;color:#fff}.btn-orange{background:#fb792b;color:#fff}
.nav{background:#213d77;color:#fff;display:flex;gap:35px;padding:13px 40px;font-weight:bold;font-size:14px}
.main{background:#f2f2f2;display:flex;justify-content:center;padding:45px 20px}
.card{background:#fff;width:430px;border-radius:10px;overflow:hidden;box-shadow:0 6px 25px rgba(0,0,0,.12)}
.head{background:#213d77;color:#fff;text-align:center;padding:20px;font-size:21px;font-weight:bold}
.head small{display:block;font-size:12px;font-weight:400;color:#cbd5e1;margin-top:4px}
.body{padding:28px}
label{font-size:12px;font-weight:bold;color:#333}
input{width:100%;height:48px;margin:7px 0 16px;padding:0 14px;border:1px solid #ccc;border-radius:4px;font-size:15px}
input:focus{outline:2px solid #213d77}
.btn-login{width:100%;height:50px;background:#fb792b;color:#fff;border:none;border-radius:4px;font-size:18px;font-weight:bold;cursor:pointer}
.btn-login:hover{background:#e86a1d}
.links{text-align:center;margin-top:18px;font-size:13px;line-height:2}
.links a{color:#213d77;font-weight:bold;text-decoration:none}
.footer{background:#213d77;color:#fff;text-align:center;padding:20px;font-size:13px}
</style></head><body>

<div class="topbar"><span>🚆 IRCTC eTicketing</span><span>📞 139 | ✉️ care@irctc.co.in</span></div>
<div class="header">
<div class="logo">IRCTC<span>•</span><small>LOGIN TO YOUR ACCOUNT</small></div>
<div style="display:flex;gap:10px"><a href="login.html" class="btn btn-blue">LOGIN</a><a href="signup.html" class="btn btn-orange">REGISTER</a></div>
</div>
<div class="nav"><span>BOOK TICKET</span><span>PNR STATUS</span><span>HOLIDAYS</span><span>CONTACT US</span></div>

<div class="main"><div class="card">
<div class="head">🔐 LOGIN<small>Welcome back to IRCTC</small></div>
<div class="body">
<form action="/validateUser" method="post">
<label>USER NAME / EMAIL ID</label>
<input type="email" name="email" placeholder="Enter your Email" required>
<label>PASSWORD</label>
<input type="password" name="password" placeholder="Enter Password" required>
<button type="submit" class="btn-login">SIGN IN →</button>
</form>
<div class="links">
<a href="signup.html">Forgot Password?</a> &nbsp;|&nbsp; <a href="signup.html">New User? Register Here</a><br>
<a href="index.html">← Back to Home</a>
</div>
</div></div></div>

<div class="footer">© 2026 IRCTC - Railway Ticket Booking Project</div>
</body></html>
